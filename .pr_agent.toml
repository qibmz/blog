# PR-Agent 配置（可选，workflow 里的 env 优先级更高）
# https://github.com/the-pr-agent/pr-agent/blob/main/pr_agent/settings/configuration.toml

[config]
model = "deepseek/deepseek-v4-flash"
fallback_models = ["deepseek/deepseek-v4-flash"]

[github_action_config]
pr_actions = ["opened", "reopened", "ready_for_review", "synchronize"]
auto_review = true
auto_describe = true
auto_improve = false

[ignore]
# 与 .coderabbit.yaml 对齐，跳过锁文件与 agent 产物
glob = [
  "pnpm-lock.yaml",
  "package-lock.json",
  ".agents/**",
  ".agent/**",
]

[pr_reviewer]
extra_instructions = "Reply in Chinese (简体中文). Focus on Nuxt 4 / Vue 3 / Nitro / Drizzle security and correctness."
